name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where?
      options: [API (backend), Flutter app (Android), Streamlit web app, Docs, Not sure]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.7.0 or a commit hash
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Please remove emails, tokens and any personal data first.
