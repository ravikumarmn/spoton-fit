# Alembic CLI config. The database URL comes from DATABASE_URL / .env (see migrations/env.py).
#   uv run alembic upgrade head                      apply migrations
#   uv run alembic revision --autogenerate -m "..."  create a migration after changing db.py
[alembic]
script_location = %(here)s/src/spotonfit/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
