[project]
name = "spotonfit"
version = "0.7.0"
description = "SpotOn: AI personal trainer API (photo/text food logging, targets, coach, history)"
readme = "README.md"
requires-python = ">=3.15.2,<3.16"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic[email]>=2.14",
    "pydantic-settings>=2.11",
    "sqlalchemy[asyncio]>=2.1",
    "aiosqlite>=0.21",
    "alembic>=1.20",
    "asyncpg>=0.30",
    "pyjwt>=2.10",
    "pwdlib[argon2]>=0.3",
    "python-multipart>=0.0.20",
    "langchain>=1.5,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.2,<4",  # coach memory in Postgres (production)
    "langgraph-checkpoint-sqlite>=3.1,<4",    # coach memory in SQLite (local dev)
    "psycopg[binary,pool]>=3.3",              # driver used by the Postgres checkpointer
    "deepagents>=0.7,<1",
    "langchain-google-genai>=4.5,<5",
    "langsmith>=0.15",
    "pandas>=2.3",
    "pillow>=12",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.13", "httpx>=0.28"]
evals = ["mlflow>=3.4"]
web = ["streamlit>=1.67", "httpx>=0.28"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
extend-exclude = ["mobile"]  # the Flutter app (Dart); its tooling ships a few Python helper files
line-length = 120
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["spotonfit", "client", "components"]  # client/components: frontend/ modules

[tool.pytest.ini_options]
testpaths = ["tests"]
